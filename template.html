<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слушания на карте</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0a2540;--mut:#6b7c93;--line:#e3e8ee;--soft:#f6f9fc;--a:#635bff;--a2:#e8e6ff;--bad:#c62828;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100dvh;font:13px/1.4 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--line);min-width:0}
header h1{font-size:16px;margin:0;white-space:nowrap}header small{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.bot{background:#229ed9;color:#fff;text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;white-space:nowrap}
.bar{display:flex;gap:6px 8px;align-items:center;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar select,.bar input[type=search]{padding:5px 7px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;max-width:100%}
.bar label{display:flex;gap:3px;align-items:center;white-space:nowrap}
button.lnk{border:0;background:none;color:var(--a);cursor:pointer;font:inherit;padding:2px 4px}
button.rst{border:1px solid var(--a);background:#fff;color:var(--a);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}.fc{background:var(--a2);color:#3b33c9;border-radius:999px;padding:2px 4px 2px 9px;cursor:pointer;display:inline-flex;gap:4px;align-items:center;max-width:260px}.fc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fc b{padding:0 5px}
main{display:grid;grid-template-columns:clamp(250px,22vw,310px) minmax(0,1fr) clamp(290px,26vw,380px);gap:8px;padding:8px;min-height:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;min-width:0}
#pm{position:relative;overflow:hidden}#m{position:absolute;inset:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:5px 7px}.kpi b{display:block;font-size:19px;line-height:1.1}.kpi span{color:var(--mut);font-size:11px}
.chart{padding:4px 10px 8px;border-top:1px solid var(--line)}.chart h3{font-size:12px;margin:6px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.bar2{display:grid;grid-template-columns:minmax(80px,1fr) 70px 26px;gap:6px;align-items:center;padding:2px 3px;border-radius:5px;cursor:pointer}.bar2:hover{background:var(--soft)}
.bar2 .nm{overflow-wrap:anywhere;line-height:1.2}.bar2 i{display:block;height:11px;background:var(--a);border-radius:3px;min-width:2px}.bar2 .n{text-align:right;color:var(--mut)}
.bar2.sel{background:var(--a2);font-weight:600}.has-sel .bar2:not(.sel) i{opacity:.35}.bar2.muted .nm{color:var(--mut)}
.more{color:var(--a);cursor:pointer;padding:2px 3px}
.lh{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}.lh b{flex:1}
.it{padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--soft)}
.it .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.it.open .t{display:block}
.it .mt{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:0 7px;border-radius:999px;font-size:11px;background:#eef1f6;margin:2px 3px 0 0}.chip.bad{background:#fdeaea;color:var(--bad)}.chip.ok{background:#e7f6ee;color:#0e7a50}
.dt{margin-top:6px;font-size:12px;line-height:1.5;cursor:default}.dt a{color:var(--a)}
.leg{position:absolute;z-index:500;background:#fffe;border-radius:8px;font-size:11px;box-shadow:0 1px 4px #0003;padding:5px 8px}
#leg{left:8px;bottom:22px;max-width:240px}#leg2{right:8px;top:8px;max-width:190px;max-height:60%;overflow:auto;display:none;font-size:10px;line-height:1.25}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}#leg2 i{border-radius:2px}
.leg2i{cursor:pointer;padding:1px 2px;border-radius:4px;display:block}.leg2i:hover,.leg2i.sel{background:var(--a2)}
.lbl{background:#fffd;border:0;box-shadow:none;font-size:11px;padding:0 3px;color:#222}#m:not(.z15) .lbl{display:none}
.pop{max-width:290px}.pop h4{margin:0 0 3px;font-size:13px}.pop .lbl2{color:var(--mut)}.pop p{margin:4px 0}
#mtabs{display:none}#ft{display:none}#more{display:contents}
@media(max-width:940px){
 body{grid-template-rows:auto auto minmax(0,1fr) auto}
 main{grid-template-columns:1fr;padding:4px}.panel{display:none}.panel.on{display:block}#pm.on{display:block}
 #mtabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line)}
 #mtabs button{border:0;background:none;padding:10px 4px;font:inherit;font-weight:600;color:var(--mut)}#mtabs button.on{color:var(--a);box-shadow:inset 0 -3px 0 var(--a)}
 header small{display:none}#ft{display:inline-block}#more{display:none;flex-wrap:wrap;gap:6px;width:100%}.bar.open #more{display:flex}.chips{width:100%}
 #leg{max-width:150px;bottom:6px}
}
.cd{padding:10px 12px}.cd h2{font-size:15px;margin:2px 0 6px}.cd h3{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin:14px 0 4px}
.big{font-weight:600;margin:8px 0}.big.ok2{color:#0e7a50}.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.b{border:1px solid var(--a);background:#fff;color:var(--a);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}.b.blue{background:#229ed9;border-color:#229ed9;color:#fff}
.box{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}.box textarea{width:100%;font:inherit;margin:4px 0;border:1px solid var(--line);border-radius:6px;padding:5px}
.ft{width:100%;border-collapse:collapse}.ft td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}.ft td:first-child{color:var(--mut);width:34%}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pm ul{margin:4px 0;padding-left:16px}.pm b{color:var(--ink)}
@media(max-width:520px){.pm{grid-template-columns:1fr}}
.pr{padding:5px 7px;border:1px solid var(--line);border-radius:7px;margin:4px 0;cursor:pointer}.pr:hover{background:var(--soft)}.lbl2{color:var(--mut);font-size:12px}
.cd details{margin:8px 0}.cd summary{cursor:pointer;color:var(--a)}
</style></head><body>
<header><h1>Слушания Ярославля</h1><small>Публичные обсуждения мэрии 2023-2026. Данные с портала мэрии, итоги - из заключений.</small><a class="bot" href="https://t.me/slushaniya_yaroslavl_bot" target="_blank" rel="noopener">Уведомления в Telegram</a></header>
<div class="bar" id="bar"><button class="rst" id="ft">Фильтры</button><span id="more"><select id="fd"><option value="">Все районы</option></select>
<select id="fk"><option value="">Все типы вопросов</option></select>
<select id="fy"><option value="">Все годы</option></select>
<select id="fw"><option value="">Любой срок</option><option value="now">Идут сейчас</option><option value="7">За 7 дней</option><option value="30">За 30 дней</option><option value="90">За 90 дней</option><option value="year">Этот год</option></select>
<input id="fq" type="search" placeholder="Улица, адрес, слово..." size="16">
<label><input type="checkbox" id="fr"> Замечания</label><label><input type="checkbox" id="fo"> Отказ</label><label><input type="checkbox" id="fu"> Меняют вид</label><button class="lnk" id="csv">CSV</button></span><label title="Карта функциональных зон генплана; клик по зоне - описание"><input type="checkbox" id="fg"> Генплан</label><input type="range" id="fgo" min="20" max="90" value="60" style="width:60px">
<button class="rst" id="rs">Сбросить всё</button><span class="chips" id="chips"></span><span id="cnt" style="margin-left:auto;color:var(--mut)"></span></div>
<main>
<section class="panel" id="pc"><div class="kpis" id="kpis"></div><div id="charts"></div></section>
<section class="panel on" id="pm"><div id="m"></div><div class="leg" id="leg"></div><div class="leg" id="leg2"></div></section>
<section class="panel" id="pl"><div id="listv"><div class="lh"><b id="lc"></b><select id="so"><option value="end">по дате</option><option value="remarks">по замечаниям</option></select></div><div id="list"></div></div><div id="card" style="display:none"></div></section>
</main>
<nav id="mtabs"><button data-p="pm" class="on">Карта</button><button data-p="pc">Цифры</button><button data-p="pl">Список</button></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const D=__DATA__,GL=__LEGEND__,GRID=__GRID__,DIST=__DIST__,X=__EXTRA__;const BOT='https://t.me/slushaniya_yaroslavl_bot';
const COL={'Планировка и межевание':'#2a7ab9','Межевание':'#5aa9e6','Условно разрешённый вид':'#e08a1e','Отклонение от параметров':'#8e5bb5','Дорога / линейный объект':'#444','Другое':'#999'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=i=>document.getElementById(i);
const fmt=d=>d?d.split('-').reverse().join('.'):'-';
const todayS=new Date().toISOString().slice(0,10),back=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const recT=d=>!d.has_result?'Итог не получен':d.rec==='отказ'?'Рекомендован отказ':d.rec?'Рекомендовано утвердить':'Итог не распознан';
const remT=d=>!d.has_result?'-':d.remarks?`${d.remarks} замеч.`:'без замечаний';
const resT=d=>d.residents==null?'-':d.residents?'участвовали':'не участвовали';
const change=d=>d.kind==='Условно разрешённый вид';
const DIMS=[
 {k:'district',t:'Район',get:d=>d.district||'не указан',top:7},
 {k:'kind',t:'Тип вопроса',get:d=>d.kind,top:7},
 {k:'year',t:'Год',get:d=>(d.start||'').slice(0,4)||null,top:6,sortKey:true},
 {k:'init',t:'Инициатор (где указан в материалах)',get:d=>d.init||'не указан',top:5},
 {k:'want',t:'Во что переводят участки',get:d=>d.want||null,top:6},
 {k:'gp',t:'Зона генплана в месте слушания (приблизительно)',get:d=>d.gp||null,top:6}];
const F={district:'',kind:'',year:'',init:'',want:'',gp:'',win:'',q:'',rem:0,rej:0,chg:0};
const dim=k=>DIMS.find(x=>x.k===k);
function flt(except){const q=F.q.trim().toLowerCase();
 return D.filter(d=>{for(const x of DIMS){if(x.k!==except&&F[x.k]&&x.get(d)!==F[x.k])return false}
  if(F.win&&!(F.win==='now'?(d.end||'')>=todayS:F.win==='year'?(d.start||'').startsWith(todayS.slice(0,4)):(d.end||'')>=back(+F.win)))return false;
  if(F.rem&&!d.remarks)return false;if(F.rej&&d.rec!=='отказ')return false;if(F.chg&&!change(d))return false;
  if(q&&!(d.plain+' '+d.title+' '+(d.addr||'')+' '+(d.init||'')).toLowerCase().includes(q))return false;return true})}
// ---------- карта
const CITY=[[57.5257,39.7036],[57.7753,40.0031]];
const m=L.map('m',{zoomSnap:0.5,zoomDelta:1,wheelDebounceTime:60,wheelPxPerZoomLevel:90}).fitBounds(CITY);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
const A=[57.775310,39.703643,57.525664,40.003073];// N,W,S,E
const gpImg=new Image();gpImg.src='genplan.webp';
const GP=L.GridLayer.extend({createTile(c,done){const t=document.createElement('canvas'),s=this.getTileSize();t.width=s.x;t.height=s.y;
 const draw=()=>{const nw=m.unproject([c.x*s.x,c.y*s.y],c.z),se=m.unproject([(c.x+1)*s.x,(c.y+1)*s.y],c.z),W=gpImg.naturalWidth,H=gpImg.naturalHeight;
  const ix=lo=>(lo-A[1])/(A[3]-A[1])*W,iy=la=>(A[0]-la)/(A[0]-A[2])*H;
  const x0=ix(nw.lng),x1=ix(se.lng),y0=iy(nw.lat),y1=iy(se.lat),cx0=Math.max(0,x0),cx1=Math.min(W,x1),cy0=Math.max(0,y0),cy1=Math.min(H,y1);
  if(cx1>cx0&&cy1>cy0){const kx=s.x/(x1-x0),ky=s.y/(y1-y0);t.getContext('2d').drawImage(gpImg,cx0,cy0,cx1-cx0,cy1-cy0,(cx0-x0)*kx,(cy0-y0)*ky,(cx1-cx0)*kx,(cy1-cy0)*ky)}setTimeout(()=>done(null,t),0)};
 gpImg.complete&&gpImg.naturalWidth?draw():gpImg.addEventListener('load',draw,{once:true});return t}});
const gpl=new GP({opacity:.6,tileSize:256,updateWhenZooming:false,keepBuffer:1});
const layer=L.featureGroup().addTo(m),outline=L.layerGroup().addTo(m);let mk={};
function shapeOf(d){const rough=(d.how||'').startsWith('район'),bad=d.rec==='отказ',dash=(rough||d.approx)?'5':null,base={color:bad?'#c00':COL[d.kind],weight:bad?3:2,fillColor:COL[d.kind],bubblingMouseEvents:false,dashArray:dash};
 const s=d.shape;let o;
 if(s&&s[0]==='poly')o=L.polygon(s[1],{...base,fillOpacity:.28,weight:base.weight+Math.min(d.remarks/25,3)});
 else if(s&&s[0]==='rect'&&!d.how.startsWith('адрес'))o=L.rectangle([[s[1],s[2]],[s[3],s[4]]],{...base,fillOpacity:.2});
 else if(s&&s[0]==='circle')o=L.circle([d.lat,d.lon],{...base,radius:s[1],fillOpacity:.15});
 else o=L.circleMarker([d.lat,d.lon],{...base,color:bad?'#c00':'#fff',weight:bad?3:1,radius:rough?9:7+Math.min(d.remarks,80)/6,fillOpacity:rough?.35:.85});
 o.on('click',()=>openCard(d.id,true));if(d.label)o.bindTooltip(esc(d.label),{permanent:true,direction:'center',className:'lbl',opacity:1});return o}
function drawMap(list){layer.clearLayers();mk={};list.filter(d=>d.lat!=null).forEach(d=>{const o=shapeOf(d);mk[d.id]=o;o.addTo(layer)})}
function focusOn(id){const o=mk[id];if(!o)return;const d=D.find(x=>x.id===id);setPanel('pm');m.invalidateSize();
 if(o.getBounds&&d.how&&!d.how.startsWith('адрес'))m.fitBounds(o.getBounds().pad(.4),{maxZoom:17});else m.setView(o.getLatLng(),Math.max(m.getZoom(),16))}
function zoomDistrict(){outline.clearLayers();const n=F.district;
 if(n&&DIST.box[n]){m.fitBounds(DIST.box[n],{padding:[10,10]});L.polygon(DIST.out[n],{color:'#635bff',weight:2,fill:false,dashArray:'6',interactive:false}).addTo(outline)}else m.fitBounds(CITY)}
// клик по зоне генплана
function zoneAt(ll){const w=GRID.w,h=GRID.h,x=Math.floor((ll.lng-A[1])/(A[3]-A[1])*w),y=Math.floor((A[0]-ll.lat)/(A[0]-A[2])*h);
 if(x<0||y<0||x>=w||y>=h)return -1;if(!GRID.flat){GRID.flat=new Uint8Array(w*h);let p=0;for(let i=0;i<GRID.rle.length;i+=2){GRID.flat.fill(GRID.rle[i],p,p+GRID.rle[i+1]);p+=GRID.rle[i+1]}}
 for(let r=0;r<=3;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;const v=GRID.flat[yy*w+xx];if(v<17)return v}return -1}
m.on('click',e=>{if(!$('fg').checked)return;const i=zoneAt(e.latlng);if(i<0)return;const z=GL[i];
 L.popup({maxWidth:320}).setLatLng(e.latlng).setContent(`<div class="pop"><h4><i style="display:inline-block;width:11px;height:11px;border-radius:2px;background:rgb(${z.rgb});margin-right:5px"></i>${esc(z.name)}</h4>`+
 `<p><b>Характер освоения:</b> ${esc(z.character)}<br><b>Площадь зоны в городе:</b> ${esc(z.area_ha)} га (${esc(z.pct)}% города)</p><p><b>Назначение:</b> ${esc(z.desc)}</p>`+(z.uses?`<p><b>Основные виды использования:</b> ${esc(z.uses)}</p>`:'')+(z.density?`<p><b>Плотность и этажность:</b> ${esc(z.density)}</p>`:'<p class="lbl2">Плотность застройки для этой зоны в Положении генплана не указана.</p>')+`<div class="lbl2">Генплан Ярославля, ред. приказа от 03.09.2026 № 36. Граница зоны на карте приблизительна (до ~300 м).</div></div>`).openOn(m)});
$('fg').onchange=()=>{$('fg').checked?gpl.addTo(m):m.removeLayer(gpl);$('leg2').style.display=$('fg').checked?'block':'none'};
$('fgo').oninput=()=>gpl.setOpacity($('fgo').value/100);
const z15=()=>$('m').classList.toggle('z15',m.getZoom()>=15);m.on('zoomend',z15);z15();
$('leg').innerHTML=Object.entries(COL).map(([k,v])=>`<i style="background:${v}"></i>${k}`).join('<br>')+'<br><small>Рамка/контур - затронутая территория. Красная - отказ. Пунктир - место неточное.</small>';
function legend2(){$('leg2').innerHTML='<b>Генплан: зоны</b> <small>(клик - фильтр)</small>'+GL.map(l=>`<span class="leg2i${F.gp===l.name?' sel':''}" data-gp="${esc(l.name)}"><i style="background:rgb(${l.rgb})"></i>${esc(l.name)}</span>`).join('')+'<small>Источник: карта функциональных зон генплана, сайт мэрии. Привязка приблизительная.</small>'}
$('leg2').onclick=e=>{const s=e.target.closest('[data-gp]');if(s)tog('gp',s.dataset.gp)};
// ---------- цифры
function kpis(list){const r=list.filter(d=>d.has_result),rm=r.reduce((s,d)=>s+d.remarks,0);
 $('kpis').innerHTML=[[list.length,'слушаний'],[list.filter(change).length,'меняют вид'],[rm,'замечаний'],[r.filter(d=>d.remarks>0).length+'/'+r.length,'с замечаниями'],[r.filter(d=>d.residents).length,'жители участв.'],[list.filter(d=>d.rec==='отказ').length,'отказов']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
const expanded={};
function charts(){$('charts').innerHTML=DIMS.map(x=>{const c={};flt(x.k).forEach(d=>{const v=x.get(d);if(v!=null)c[v]=(c[v]||0)+1});
 let e=Object.entries(c);e.sort(x.sortKey?(a,b)=>b[0].localeCompare(a[0]):(a,b)=>b[1]-a[1]);
 if(F[x.k]&&!c[F[x.k]])e.unshift([F[x.k],0]);const mx=Math.max(1,...e.map(a=>a[1])),shown=expanded[x.k]?e:e.slice(0,x.top);
 if(F[x.k]&&!shown.some(a=>a[0]===F[x.k])){const s=e.find(a=>a[0]===F[x.k]);if(s)shown.push(s)}
 return `<div class="chart ${F[x.k]?'has-sel':''}"><h3>${x.t}</h3>`+(e.length?shown.map(([k,v])=>`<div class="bar2${F[x.k]===k?' sel':''}${k==='не указан'?' muted':''}" data-d="${x.k}" data-v="${esc(k)}"><span class="nm">${esc(k)}</span><span><i style="width:${Math.max(2,v/mx*100)}%"></i></span><span class="n">${v}</span></div>`).join('')+(e.length>x.top?`<div class="more" data-more="${x.k}">${expanded[x.k]?'свернуть':'ещё '+(e.length-shown.length)}</div>`:''):'<div class="lbl2" style="color:var(--mut)">нет данных в выбранном срезе</div>')+'</div>'}).join('')}
$('charts').onclick=e=>{const b=e.target.closest('[data-d]');if(b){tog(b.dataset.d,b.dataset.v);return}const mo=e.target.closest('[data-more]');if(mo){expanded[mo.dataset.more]=!expanded[mo.dataset.more];charts()}};
// ---------- список и карточка
let openId=null;
function renderRight(){if(openId!=null){$('listv').style.display='none';$('card').style.display='block';card(D.find(x=>x.id===openId))}else{$('card').style.display='none';$('listv').style.display='block';list(flt())}}
function list(l){const k=$('so').value;const L2=[...l].sort((a,b)=>k==='remarks'?b.remarks-a.remarks:(b.end||'').localeCompare(a.end||''));$('lc').textContent=`Слушания: ${l.length}`;
 $('list').innerHTML=L2.map(d=>`<div class="it" data-id="${d.id}"><div class="t">${esc(d.plain)}</div><div class="mt">${esc(d.district||'район не указан')} · ${stat(d).short}</div>`+
 `<span class="chip">${esc(d.kind)}</span>`+(d.remarks?`<span class="chip bad">${d.remarks} замеч.</span>`:'')+(d.rec==='отказ'?'<span class="chip bad">отказ</span>':'')+(d.lat==null?'<span class="chip">нет на карте</span>':'')+`</div>`).join('')||'<p style="padding:12px;color:var(--mut)">Ничего не найдено</p>'}
const dleft=d=>Math.round((Date.parse(d.end)-Date.parse(todayS))/864e5);
function stat(d){if(!d.end)return{short:'срок не указан',long:'Срок приёма замечаний не указан.',open:false};const n=dleft(d);
 if(n<0)return{short:'завершено '+fmt(d.end),long:`Приём замечаний завершён ${fmt(d.end)}.`,open:false};
 if(n===0)return{short:'последний день',long:`Сегодня последний день приёма замечаний (${fmt(d.end)}).`,open:true};
 return{short:`до ${fmt(d.end)} (${n} дн.)`,long:`Приём замечаний до ${fmt(d.end)}, осталось ${n} дн.`,open:true}}
function openCard(id,fromMap){openId=id;renderRight();if(innerWidth<=940&&fromMap)setPanel('pl');$('pl').scrollTop=0}
function closeCard(){openId=null;renderRight()}
$('list').onclick=e=>{const it=e.target.closest('.it');if(!it)return;const id=+it.dataset.id;openCard(id);const d=D.find(x=>x.id===id);if(d.lat!=null&&innerWidth>940)focusOn(id)};
$('so').onchange=()=>list(flt());
function ics(d){const z=s=>s.replace(/-/g,''),nx=new Date(Date.parse(d.end)+864e5).toISOString().slice(0,10).replace(/-/g,'');
 const esc2=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//slushaniya-yaroslavl//RU','BEGIN:VEVENT','UID:ev-'+d.id+'@slushaniya-yaroslavl','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+z(d.end),'DTEND;VALUE=DATE:'+nx,
 'SUMMARY:'+esc2('Последний день замечаний: '+d.plain),'DESCRIPTION:'+esc2('Слушание: '+d.title+'\nСтраница мэрии: '+d.url),'URL:'+d.url,'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+esc2('Завтра последний день приёма замечаний'),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function copy(txt,btn){const done=()=>{const o=btn.textContent;btn.textContent='Скопировано';setTimeout(()=>btn.textContent=o,1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fb());else fb();
 function fb(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}}
const POS={'за':'Поддерживаю','против':'Не согласен','вопрос':'Вопрос'};
function templ(d){const w=d.addr||d.plain,ttl=`«${d.plain}»`+(d.addr&&!d.plain.includes(d.addr)?` (${d.addr})`:''),sign='\n\nЧтобы замечание учли, укажите ФИО, дату рождения и адрес проживания: [заполните].';
 return[['Поддерживаю',`Прошу учесть моё мнение по вопросу ${ttl}. Я поддерживаю предлагаемое решение.\nПочему это важно для меня: [напишите своими словами].`+sign],
 ['Не согласен',`Не согласен с предлагаемым решением по вопросу ${ttl} и прошу его не утверждать в предложенном виде.\nПричины: [например: нагрузка на двор и проезд, этажность, зелёная зона - укажите свои].`+sign],
 ['Прошу учесть / разъяснить',`Прошу учесть и разъяснить по вопросу ${ttl}:\n1) [ваш вопрос или условие];\n2) [ваш вопрос или условие].\nПрошу направить ответ в установленном порядке.`+sign]]}
function card(d){const st=stat(d),K=X.kinds[d.ckey]||X.kinds.other,docs=d.docs.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('<br>'),ops=X.opinions.filter(o=>o.event_id===d.id);
 const when=d.meet?`<b>Встреча:</b> ${esc(d.meet)}<br>`:'',expo=d.expo?`<b>Экспозиция (из протокола):</b> ${esc(d.expo)}<br>`:'';
 const facts=[['Что меняют',change(d)?`${d.was?'сейчас: '+esc(d.was)+'; ':''}хотят: «${esc(d.want||'-')}»`:null],['Суть проекта (из документов)',d.purpose?esc(d.purpose):null],['Адрес / участок',d.addr?esc(d.addr):null],['Кадастровый номер',d.cad?esc(d.cad):null],['Площадь',d.area?d.area+' м²':null],['Зона ПЗЗ',d.zone?esc(d.zone)+(d.zone_name?' ('+esc(d.zone_name)+')':''):null],['Зоны генплана на этой территории',d.gpz?d.gpz.map(z=>esc(z[0])+' '+z[1]+'%').join('; ')+' <span class="lbl2">(приблизительно)</span>':null]].filter(f=>f[1]);
 const T=templ(d);
 $('card').innerHTML=`<div class="lh"><button class="lnk" id="cb">← К списку</button><b></b>${d.lat!=null?'<button class="lnk" id="cm">На карте</button>':''}</div><div class="cd">
 <h2>${esc(d.plain)}</h2><div><span class="chip">${esc(d.kind)}</span><span class="chip ${st.open?'ok':''}">${st.open?'идёт приём замечаний':'завершено'}</span>${d.rec==='отказ'?'<span class="chip bad">рекомендован отказ</span>':''}</div>
 <p class="big ${st.open?'ok2':''}">${esc(st.long)}</p>
 <p>${when}${expo}${when||expo?'':'<span class="lbl2">Дата, время и место проведения в материалах не указаны (формат - общественные обсуждения: замечания принимаются письменно и онлайн).</span>'}</p>
 <div class="btns"><button class="b" id="bc">Добавить в календарь${st.open?'':' (срок прошёл)'}</button><a class="b blue" href="${BOT}?start=ev_${d.id}" target="_blank" rel="noopener">Следить в боте</a><a class="b" href="#" id="bs">Подать замечание</a></div>
 <div id="how" style="display:none" class="box">${esc(X.tail)}<br><a href="https://www.gosuslugi.ru/" target="_blank" rel="noopener">Госуслуги</a> (виджет «Мой выбор, Моё будущее») · <a href="${esc(d.url)}" target="_blank" rel="noopener">Страница слушания на портале мэрии</a></div>
 <h3>Что предлагают</h3><p>${esc(d.expl)}</p>${facts.length?'<table class="ft">'+facts.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join('')+'</table>':''}
 <p class="lbl2">Место на карте: ${esc(d.how||'не определено')}${d.approx?'. Границы приблизительные.':''}</p>
 <h3>Что может измениться</h3><div class="pm"><div><b>Возможные плюсы</b><ul>${K.pros.map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>-</li>'}</ul></div><div><b>На что обратить внимание</b><ul>${K.risks.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div></div><p class="lbl2">Общие последствия для такого типа вопроса, не оценка конкретного проекта, заявителя или людей.</p>
 ${d.has_result?`<h3>Итог обсуждения</h3><p>Жители ${resT(d)}; замечаний: ${d.remarks}; ${recT(d)}.</p>`:''}
 ${d.prior&&d.prior.length?'<h3>Раньше здесь</h3>'+d.prior.map(p=>`<div class="pr" data-open="${p.id}"><b>${esc(p.plain)}</b><br><span class="lbl2">${esc(p.why)} · ${fmt(p.end)} · ${p.has_result?(p.remarks?p.remarks+' замеч., ':'без замечаний, ')+(p.rec==='отказ'?'рекомендован отказ':p.rec?'рекомендовано утвердить':'итог не распознан'):'итог не получен'}</span></div>`).join(''):''}
 <h3>Что пишут по этому слушанию</h3>${ops.length?ops.map(o=>`<div class="pr"><span class="chip">${esc(o.position)}</span> ${esc(o.platform||'')} · ${esc(o.date||'')} <a href="${esc(o.url)}" target="_blank" rel="noopener">ссылка</a></div>`).join(''):'<p class="lbl2">Проверенных ссылок пока нет.</p>'}
 <details><summary>Добавить ссылку на публичный пост</summary><div class="box"><select id="op"><option>за</option><option>против</option><option>вопрос</option></select> <input id="ol" type="url" placeholder="https://ссылка-на-пост" style="width:100%;margin:4px 0"><input id="ot" placeholder="Площадка (ВК, Telegram, сайт)" style="width:60%"> <input id="od" type="date"><br><button class="b" id="oc">Скопировать предложение</button><p class="lbl2">Страница ничего не публикует и не отправляет. Скопированный текст отправьте боту: ссылка сначала будет проверена, на карте она появится только после проверки.</p></div></details>
 <h3>Заготовки замечания</h3><p class="lbl2">Это шаблоны: отредактируйте и отправьте сами. Страница ничего никуда не отправляет. Для учёта замечания нужна идентификация участника (ФИО, дата рождения, адрес) по ст. 5.1 Градостроительного кодекса.</p>
 ${T.map((x,i)=>`<div class="box"><b>${x[0]}</b><textarea id="tp${i}" rows="5">${esc(x[1])}</textarea><button class="b cp" data-i="${i}">Копировать</button></div>`).join('')}
 <h3>Документы</h3><p>${docs||'<span class="lbl2">Документы не приложены.</span>'}</p>
 <details><summary>Официальное название</summary><p>${esc(d.title)}</p></details></div>`;
 $('cb').onclick=closeCard;const cm=$('cm');if(cm)cm.onclick=()=>focusOn(d.id);
 $('bc').onclick=()=>d.end&&dl('slushanie-'+d.id+'.ics',ics(d),'text/calendar');
 $('bs').onclick=e=>{e.preventDefault();const h=$('how');h.style.display=h.style.display==='none'?'block':'none'};
 $('card').querySelectorAll('.cp').forEach(b=>b.onclick=()=>copy($('tp'+b.dataset.i).value,b));
 $('oc').onclick=()=>{const u=$('ol').value.trim();if(!/^https?:\/\//.test(u)){$('ol').focus();return}copy(`Предлагаю ссылку к слушанию #${d.id} («${d.plain}»)\nПозиция: ${$('op').value}\nПлощадка: ${$('ot').value||'-'}\nДата: ${$('od').value||'-'}\nСсылка: ${u}`,$('oc'))};
 $('card').onclick=e=>{const p=e.target.closest('[data-open]');if(p)openCard(+p.dataset.open)}}
// ---------- состояние
function tog(k,v){F[k]=F[k]===v?'':v;sync();if(k==='district')zoomDistrict()}
function chips(){const c=[];DIMS.forEach(x=>{if(F[x.k])c.push([x.k,x.t.split(' (')[0]+': '+F[x.k]])});if(F.win)c.push(['win',{now:'Идут сейчас',year:'Этот год'}[F.win]||'За '+F.win+' дн.']);if(F.q)c.push(['q','«'+F.q+'»']);if(F.rem)c.push(['rem','Замечания']);if(F.rej)c.push(['rej','Отказ']);if(F.chg)c.push(['chg','Меняют вид']);
 $('chips').innerHTML=c.map(([k,t])=>`<span class="fc" data-x="${k}"><span title="${esc(t)}">${esc(t)}</span><b>×</b></span>`).join('')}
$('chips').onclick=e=>{const c=e.target.closest('[data-x]');if(!c)return;const k=c.dataset.x;F[k]=(typeof F[k]==='number')?0:'';sync();if(k==='district')zoomDistrict()};
function ctrls(){$('fd').value=F.district;$('fk').value=F.kind;$('fy').value=F.year;$('fw').value=F.win;$('fq').value=F.q;$('fr').checked=!!F.rem;$('fo').checked=!!F.rej;$('fu').checked=!!F.chg}
function sync(){ctrls();const l=flt();$('cnt').textContent=`Найдено: ${l.length} из ${D.length}`;chips();kpis(l);charts();renderRight();drawMap(l);legend2()}
const uniq=a=>[...new Set(a)].filter(Boolean).sort();
uniq(D.map(d=>d.district)).forEach(v=>$('fd').add(new Option(v,v)));uniq(D.map(d=>d.kind)).forEach(v=>$('fk').add(new Option(v,v)));uniq(D.map(d=>(d.start||'').slice(0,4))).reverse().forEach(v=>$('fy').add(new Option(v,v)));
$('fd').onchange=()=>{F.district=$('fd').value;sync();zoomDistrict()};$('fk').onchange=()=>{F.kind=$('fk').value;sync()};$('fy').onchange=()=>{F.year=$('fy').value;sync()};$('fw').onchange=()=>{F.win=$('fw').value;sync()};
$('fq').oninput=()=>{F.q=$('fq').value;sync()};$('fr').onchange=()=>{F.rem=$('fr').checked?1:0;sync()};$('fo').onchange=()=>{F.rej=$('fo').checked?1:0;sync()};$('fu').onchange=()=>{F.chg=$('fu').checked?1:0;sync()};
$('ft').onclick=()=>$('bar').classList.toggle('open');
$('rs').onclick=()=>{Object.keys(F).forEach(k=>F[k]=typeof F[k]==='number'?0:'');openId=null;sync();zoomDistrict()};
$('csv').onclick=()=>{const l=flt(),h=['Что предлагают','Официальное название','Район','Тип','Начало','Конец','Инициатор','Замечаний','Итог','Было','Станет','Зона ПЗЗ','Зона генплана','Кадастровый номер','Ссылка'],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t='﻿'+[h.map(q).join(';')].concat(l.map(d=>[d.plain,d.title,d.district,d.kind,d.start,d.end,d.init,d.remarks,recT(d),d.was,d.want,d.zone,d.gp,d.cad,d.url].map(q).join(';'))).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='слушания-ярославль.csv';a.click()};
function setPanel(id){document.querySelectorAll('#mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));['pc','pm','pl'].forEach(p=>$(p).classList.toggle('on',p===id));setTimeout(()=>m.invalidateSize(),30)}
$('mtabs').onclick=e=>{const b=e.target.closest('button');if(b)setPanel(b.dataset.p)};
function desk(){if(innerWidth>940)['pc','pm','pl'].forEach(p=>$(p).classList.remove('on'));else if(!['pc','pm','pl'].some(p=>$(p).classList.contains('on')))setPanel('pm');setTimeout(()=>m.invalidateSize(),30)}
addEventListener('resize',desk);desk();sync();
try{const q=+new URLSearchParams(location.search).get('id');if(q&&D.some(d=>d.id===q)){openCard(q,true);setTimeout(()=>{m.invalidateSize();if(innerWidth>940)focusOn(q)},150)}}catch(e){}
</script></body></html>
